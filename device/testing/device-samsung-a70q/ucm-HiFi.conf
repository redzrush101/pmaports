# Samsung Galaxy A70 (SM6150/QCS615): one WSA8815 speaker amp (mono), WCD9370
# earpiece/headset/analog mics. MultiMedia1 (hw:0) plays to the speaker,
# MultiMedia2 (hw:1) captures from the WCD and MultiMedia3 (hw:2) plays to
# the WCD. The DSP routes stay enabled so that every PCM can be opened.

SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3' 1"
	]
	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='WSA RX0 MUX' AIF1_PB"
		cset "name='WSA RX1 MUX' AIF1_PB"
		# One speaker: mix left and right, 6 dB down so the sum cannot clip.
		cset "name='WSA_RX0 INP0' RX0"
		cset "name='WSA_RX0 INP1' RX1"
		cset "name='WSA_RX0 Digital Volume' 75"
		cset "name='WSA_COMP1 Switch' 1"
		cset "name='SpkrLeft COMP Switch' 1"
		cset "name='SpkrLeft BOOST Switch' 1"
		cset "name='SpkrLeft DAC Switch' 1"
		cset "name='SpkrLeft VISENSE Switch' 0"
		# 12 dB PA gain; there is no DSP speaker protection yet.
		cset "name='SpkrLeft PA Volume' 8"
	]
	DisableSequence [
		cset "name='SpkrLeft DAC Switch' 0"
		cset "name='SpkrLeft BOOST Switch' 0"
		cset "name='SpkrLeft COMP Switch' 0"
		cset "name='WSA_COMP1 Switch' 0"
		cset "name='WSA_RX0 Digital Volume' 81"
		cset "name='WSA_RX0 INP1' ZERO"
		cset "name='WSA_RX0 INP0' ZERO"
		cset "name='WSA RX1 MUX' ZERO"
		cset "name='WSA RX0 MUX' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_RX0 Digital Volume' 79"
		cset "name='EAR_RDAC Switch' 1"
	]
	DisableSequence [
		cset "name='EAR_RDAC Switch' 0"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_RX0 Digital Volume' 84"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},2"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Earpiece"
	]

	Include.wcdhpe.File "/codecs/wcd937x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd937x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic1" {
	Comment "Main microphone"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 98"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Mic2" {
	Comment "Secondary microphone"

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 98"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},1"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' INP2"
		cset "name='ADC2 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 102"
	]
	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
