# The ADSP sensor framework updates its registry at startup and crashes the
# ADSP if it cannot. Serve a writable copy of the registry from the phone's
# persist partition, which msm-firmware-loader mounts read-only.
[Unit]
Requires=msm-firmware-loader.service
After=msm-firmware-loader.service
# Do not keep restarting the ADSP sensor framework if it fails
StartLimitIntervalSec=120
StartLimitBurst=3

[Service]
StateDirectory=hexagonrpcd
ExecStartPre=+/usr/libexec/xiaomi-peridot-sensors-registry
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -P /var/lib/hexagonrpcd/persist
